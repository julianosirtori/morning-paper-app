name: Relatar um bug
description: Algo não funciona como deveria.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra o app
        2. Vá em Fontes
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do app
      description: No Finder, clique com o botão direito em Morning Paper.app › Obter Informações.
      placeholder: "0.8.4"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Versão do macOS
      placeholder: "15.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Parte do app
      options:
        - Onboarding
        - Fontes e coleta de notícias
        - Resumo por IA
        - Diagramação da edição
        - Impressão e PDF
        - Agendamento
        - Landing page
        - Outra
  - type: textarea
    id: logs
    attributes:
      label: Logs ou capturas de tela
      description: Se tiver, cole aqui. Remova dados pessoais.
