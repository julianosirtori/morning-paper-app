name: Sugerir uma funcionalidade
description: Uma ideia para melhorar o Morning Paper.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve
      description: Conte a situação em que você sentiu falta disso.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: O que você propõe
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribuição
      options:
        - label: Posso ajudar a implementar
