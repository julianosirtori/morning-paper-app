name: Landing page

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "apps/desktop/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm landing:build
        env:
          # Domínio próprio configurado no GitHub Pages: o site fica na raiz.
          SITE_URL: https://morning-paper-app.julianosirtori.dev
          BASE_PATH: /
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
